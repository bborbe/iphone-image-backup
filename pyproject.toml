[project]
name = "iphone-image-backup"
version = "0.4.2"
description = "Direct iPhone photo backup tool using pymobiledevice3"
requires-python = ">=3.14"
license = { text = "BSD-2-Clause" }
readme = "README.md"
authors = [
    { name = "Benjamin Borbe", email = "benjamin.borbe@gmail.com" }
]
dependencies = [
    "pymobiledevice3>=4.0.0",
    "PyYAML>=6.0",
    "pathlib2>=2.3.0",
    "Pillow>=9.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-PyYAML>=6.0.0",
    "types-Pillow>=10.0.0",
]

[project.scripts]
iphone-backup = "iphone_backup.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iphone_backup"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]
exclude = ["list_iphone_files.py"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "pymobiledevice3.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pathlib2.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
